services:
  seaweedfs:
    # Pinned so a pull cannot silently change the storage server. Upgrade deliberately.
    image: chrislusf/seaweedfs:4.50
    container_name: football-seaweedfs
    environment:
      # Required. Set in .env (see .env.example); never commit a value.
      WEED_JWT_FILER_SIGNING_KEY: ${WEED_JWT_FILER_SIGNING_KEY:?Set WEED_JWT_FILER_SIGNING_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweedfs_data:/data
      - ./s3-config.json:/etc/seaweedfs/s3-config.json:ro
    command: >
      server
      -s3
      -dir=/data
      -s3.port=8333
      -master.port=9333
      -s3.config=/etc/seaweedfs/s3-config.json
    restart: unless-stopped

volumes:
  seaweedfs_data:
